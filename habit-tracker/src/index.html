<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker v1.0.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Meu Rastreador de Hábitos</h1>
        <p class="description">Um leve auxílio para melhorar sua rotina.</p>

        <div class="input-group">
            <input type="text" id="habitInput" placeholder="Ex: Beber 2L de água">
            <button onclick="handleAddHabit()">Adicionar</button>
        </div>

        <ul id="habitList"></ul>

        <div class="stats">
            Progresso Geral: <span id="progress">0%</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
